# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Refresh statistics every 15 minutes, offset from the busy start of the hour.
  schedule:
    - cron: '7,22,37,52 * * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.141.0
      HUGO_DEB_ASSET_ID: 220898007
      HUGO_DEB_SHA256: 5800e6286b6ed0d016318f026d5cbf745c8ced2cc3db17c5db9e41a32340e80b
    steps:
      # Stylesheets are committed as plain CSS; no Sass/npm installation is needed.
      # Cache the exact verified package so statistics refreshes need no Hugo download.
      - name: Cache Hugo package
        id: hugo-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hugo.deb
          key: hugo-deb-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}-${{ env.HUGO_DEB_SHA256 }}
      - name: Install Hugo CLI
        run: |
          if [[ "${{ steps.hugo-cache.outputs.cache-hit }}" != 'true' ]]; then
            # The official asset API avoids failures on the browser download endpoint.
            curl --fail --show-error --location \
              --retry 3 --retry-connrefused --retry-delay 5 \
              --connect-timeout 15 --max-time 120 --retry-max-time 300 \
              --header 'Accept: application/octet-stream' \
              --output "$RUNNER_TEMP/hugo.deb" \
              "https://api.github.com/repos/gohugoio/hugo/releases/assets/${HUGO_DEB_ASSET_ID}?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "${HUGO_DEB_SHA256}  $RUNNER_TEMP/hugo.deb" | sha256sum --check --strict
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check statistics refresh logic
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test_*.js
      - name: Restore last valid statistics snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/livestats.json
          key: visitor-stats-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: visitor-stats-v2-
      - name: Bake visitor statistics
        id: stats
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python scripts/refresh_stats.py
      - name: Save valid statistics snapshot
        if: steps.stats.outputs.updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/livestats.json
          key: visitor-stats-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify public report availability
        run: python scripts/release_2026.py status
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Exclude embargoed PDFs from the public artifact
        run: python scripts/release_2026.py check-public --directory public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
