{{- $reg := site.Data.register }}
<ol class="news-list" role="list" aria-label="News, newest first">
    {{- range sort $reg.news "published" "desc" }}
    <li>
        <a class="news-item" href="{{ .url }}" target="_blank" rel="noopener">
            <span class="news-brand" aria-hidden="true">
                {{- with .logo }}
                <img class="news-logo" src="{{ relURL . }}" width="32" height="32" alt="" loading="lazy">
                {{- else }}
                <span class="news-logo-fallback">{{ substr .outlet 0 1 }}</span>
                {{- end }}
            </span>
            <div class="news-body">
                <span class="news-outlet">{{ .outlet }}</span>
                <h2 class="news-title">{{ .title }}</h2>
            </div>
            <time class="news-date" datetime="{{ .published }}">{{ time.Format "02 Jan 2006" .published }}</time>
            <span class="news-ext" aria-hidden="true">&#8599;</span>
        </a>
    </li>
    {{- end }}
</ol>
